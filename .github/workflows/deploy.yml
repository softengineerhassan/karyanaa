name: Deploy FastAPI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ✅ Use unique tag (commit SHA)
      - name: Build Docker image
        run: docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/karyana-app:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/karyana-app:${{ github.sha }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/karyana-app:${{ github.sha }}

            docker stop karyana-app || true
            docker rm karyana-app || true

            sudo lsof -t -i:8000 | xargs -r sudo kill -9

            docker run -d -p 8000:8000 --env-file /home/ec2-user/karyanaa/.env --name karyana-app ${{ secrets.DOCKER_USERNAME }}/karyana-app:${{ github.sha }}
