name: Deploy FastAPI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/karyana-app .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/karyana-app

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/karyana-app

            docker stop karyana-app || true
            docker rm karyana-app || true

            docker run -d -p 8000:8000 \
              --env-file /home/ec2-user/karyanaa/.env \
              --name karyana-app \
              ${{ secrets.DOCKER_USERNAME }}/karyana-app
